# Minimal Project Configuration — save as ./dbctl.yaml
# Notice: NO admin credentials or host/port needed!
# They are automatically inherited from ./.dbctl/config.yaml, ~/.dbctl/config.yaml,
# or ~/.config/dbctl/config.yaml for the 'mysql' driver.

driver: mysql

databases:
  - name: my_awesome_app

users:
  - username: awesome_user
    password: my_secret_app_password
    databases:
      - my_awesome_app
