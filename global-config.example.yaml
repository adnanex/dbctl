# Global Provisioner Configuration
# Place this at ~/.provisioner/config.yaml or ~/.config/provisioner/config.yaml
# Any project running `provisioner` will automatically inherit these defaults
# for the specified driver, so project repos never need to check in root passwords.

defaults:
  mysql:
    host: 127.0.0.1
    port: 3306
    admin:
      username: root
      password: "${MYSQL_ROOT_PASSWORD:-rootpassword}"

    # Optional: Automatically start container if not running
    container:
      compose_file: "${DOCKER_COMPOSE_FILE:-/home/adnanex/workspaces/companies/stacks/dbs/docker-compose.yml}"
      service: "mysql"
      # Or standalone docker:
      # image: "mysql:8.0-debian"
      # name: "dbs-mysql"
      # ports: ["3306:3306"]
      # env:
      #   MYSQL_ROOT_PASSWORD: "rootpassword"

  postgres:
    host: 127.0.0.1
    port: 5432
    admin:
      username: root
      password: "${POSTGRES_PASSWORD:-rootpassword}"
      database: postgres

  mongodb:
    host: 127.0.0.1
    port: 27017
    admin:
      username: root
      password: "${MONGO_INITDB_ROOT_PASSWORD:-rootpassword}"
      auth_source: admin
