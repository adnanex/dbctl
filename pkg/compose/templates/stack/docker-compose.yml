services:
  mysql:
    image: mysql:8.0-debian
    container_name: dbctl-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootpassword}"
    volumes:
      - dbctl-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dbctl-net

  postgres:
    image: postgres:16-alpine
    container_name: dbctl-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-rootpassword}"
    volumes:
      - dbctl-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dbctl-net

  mongo:
    image: mongo:7
    container_name: dbctl-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:-rootpassword}"
    volumes:
      - dbctl-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dbctl-net

  redis:
    image: redis:7-alpine
    container_name: dbctl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dbctl-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dbctl-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dbctl-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-guest}"
    volumes:
      - dbctl-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dbctl-net

  kafka:
    image: bitnami/kafka:3.7
    container_name: dbctl-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - dbctl-kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dbctl-net

  nats:
    image: nats:2-alpine
    container_name: dbctl-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
    volumes:
      - dbctl-nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4222 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dbctl-net

  typesense:
    image: typesense/typesense:27.1
    container_name: dbctl-typesense
    restart: unless-stopped
    command: ["--data-dir", "/data", "--api-key=${TYPESENSE_API_KEY:-xyz}"]
    ports:
      - "8108:8108"
    volumes:
      - dbctl-typesense-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8108/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dbctl-net

networks:
  dbctl-net:
    name: dbctl-net
    driver: bridge

volumes:
  dbctl-mysql-data:
  dbctl-postgres-data:
  dbctl-mongo-data:
  dbctl-redis-data:
  dbctl-rabbitmq-data:
  dbctl-kafka-data:
  dbctl-nats-data:
  dbctl-typesense-data:
